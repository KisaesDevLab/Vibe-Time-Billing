name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push appliance image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version + lowercase owner
        id: meta
        run: |
          # Docker rejects uppercase in repository names; github.repository_owner
          # preserves the original case (e.g. KisaesDevLab) which is invalid.
          # Lowercase here so the tag string is always Docker-legal.
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build & push appliance image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Dockerfile lives at the repo root (the multi-stage builder
          # references ./apps/... from there); ops/docker/ only holds
          # compose files + the api entrypoint script.
          file: Dockerfile
          # amd64 only. arm64 was built via QEMU emulation, which roughly
          # tripled release time, and nothing in the fleet runs on ARM.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/vibe-time-billing:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/vibe-time-billing:latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Verify image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/vibe-time-billing:${{ steps.meta.outputs.version }}
