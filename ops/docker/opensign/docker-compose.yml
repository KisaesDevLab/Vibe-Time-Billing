# OpenSign self-host (official 4-service topology), adapted for this box.
#
# AGPL: OpenSign is AGPL-3.0 and runs on its own private network (see
# /LICENSING.md). The Vibe appliance never imports/bundles/links OpenSign
# source — it talks to it over HTTP only. The `server` image carries ONE
# one-line upstream bugfix (Dockerfile.server-patch); that modified source
# is in-repo per AGPL §13. The client/caddy images are unmodified upstream.
#
# Differences from upstream OpenSignLabs/OpenSign/docker-compose.yml:
#   - UI/caddy published on host 4001 (3001 is taken by vibe-tb-api), so
#     HOST_URL=https://localhost:4001 and the caddy site is localhost:4001.
#   - Dropped the 80/443 host binds (not needed for local access).
#   - Secrets + cert + storage mode live in .env.prod (gitignored).
#
# Bring up:  docker compose -f ops/docker/opensign/docker-compose.yml --env-file ops/docker/opensign/.env.prod up -d
# UI:        https://localhost:4001  (self-signed cert — accept the warning)

services:
  server:
    # Derived image: upstream :main pinned by digest + a one-line saveFile.js
    # bugfix (see Dockerfile.server-patch + the AGPL note above).
    build:
      context: .
      dockerfile: Dockerfile.server-patch
    image: vibe-opensignserver:patched
    container_name: opensign-server
    volumes:
      - opensign-files:/usr/src/app/files
    ports:
      # Loopback-only. The Parse API is reached by the appliance over the
      # shared opensign-net docker network and publicly via the Cloudflare
      # tunnel — neither uses this host port, so it must not be on LAN/tailnet.
      - '127.0.0.1:8080:8080'
    depends_on:
      - mongo
    env_file: .env.prod
    environment:
      # SERVER_URL + PUBLIC_URL come from .env.prod (public host esign.vcpa.app)
      # so they stay in one place; only NODE_ENV is fixed here.
      - NODE_ENV=production
    networks:
      - opensign-net
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: opensign-mongo
    volumes:
      - opensign-mongo-data:/data/db
    networks:
      - opensign-net
    restart: unless-stopped

  client:
    image: opensign/opensign:main
    container_name: opensign-client
    depends_on:
      - server
    env_file: .env.prod
    networks:
      - opensign-net
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: opensign-caddy
    ports:
      - '127.0.0.1:4001:4001'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - opensign-caddy-data:/data
      - opensign-caddy-config:/config
    environment:
      # Port-only ':4001' (from .env.prod) → Caddy serves plain HTTP; Cloudflare
      # does edge TLS. Falls back to localhost for a bare local eval.
      - HOST_URL=${HOST_URL:-localhost:4001}
    networks:
      - opensign-net
    # NOTE (ops): vibe-tb-cloudflared reaches this proxy as
    # http://opensign-caddy:4001 over the T&B `docker_default` network. That
    # attachment is done OUT of compose on purpose —
    #   docker network connect docker_default opensign-caddy
    # — because declaring it here would add the implicit service alias
    # `caddy` on docker_default, colliding with vibe-tb-caddy (the tunnel's
    # http://caddy:80 origin). Re-run the connect after any recreate.
    restart: unless-stopped

networks:
  opensign-net:
    name: opensign-net
    driver: bridge

volumes:
  opensign-mongo-data:
  opensign-files:
  opensign-caddy-data:
  opensign-caddy-config:
