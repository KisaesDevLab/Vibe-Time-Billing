#
# Local-only compose for running the appliance image (built from the local
# Dockerfile, tagged vibe-time-billing:local) against the dev infra
# (postgres/redis/mailhog already running from docker-compose.dev.yml).
#
# Usage:
#   docker build -t vibe-time-billing:local .            # build image first
#   docker compose -f ops/docker/docker-compose.local.yml up -d
#
# Joins the `docker_default` network (where vibe-tb-postgres + vibe-tb-redis
# live from docker-compose.dev.yml) via external network reference so DNS
# names `postgres` and `redis` resolve.
#
# Ports preserve the existing native-dev URLs:
#   http://localhost:5195 — staff app
#   http://localhost:5196 — client portal
#   http://localhost:3001 — API direct (debugging / curl)

services:
  init-static:
    # One-shot. Copies the image's bundled web + portal dists into a shared
    # volume so the caddy container can serve them. Re-runs on every `up`
    # so a fresh image rebuild propagates to the volume without manual
    # `docker volume rm`.
    image: vibe-time-billing:local
    container_name: vibe-tb-init-static
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        rm -rf /static-out/web /static-out/portal
        cp -r /app/apps/web/dist /static-out/web
        cp -r /app/apps/portal/dist /static-out/portal
        echo "init-static: copied web + portal dists"
    volumes:
      - static-content:/static-out
    restart: 'no'

  api:
    image: vibe-time-billing:local
    container_name: vibe-tb-api
    depends_on:
      init-static:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgresql://vibe:vibe@postgres:5432/vibe_tb
      REDIS_URL: redis://redis:6379
      STAFF_JWT_SECRET: ${STAFF_JWT_SECRET:?STAFF_JWT_SECRET required (export from .env)}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:?PORTAL_JWT_SECRET required (export from .env)}
      KMS_KEY: ${KMS_KEY:?KMS_KEY required (export from .env, 32 bytes base64)}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5195}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:5196}
      COMMERCIAL_LICENSE_TOKEN: ${COMMERCIAL_LICENSE_TOKEN:-}
      MAIL_PROVIDER: smtp
      MAIL_FROM: 'Vibe Dev <dev@localhost>'
      MAIL_SMTP_HOST: mailhog
      MAIL_SMTP_PORT: '1025'
      MAIL_SMTP_SECURE: 'false'
      SMS_PROVIDER: ${SMS_PROVIDER:-textlink}
      FILE_STORAGE: local
      FILE_LOCAL_PATH: /data/files
      # Stage 1B — persist the sealed firm key under the dedicated
      # volume mount.
      FIRM_KEY_SEAL_PATH: /data/firm-key/.firm-key.seal
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Q35 — OpenSign e-signature (AGPL). Deployed STANDALONE via
      # ops/docker/opensign/ (real upstream Parse 4-service stack), reached
      # over HTTP (see LICENSING.md). Self-host is a Parse Server: auth is
      # the Parse App-Id + Master-Key pair (not a shared secret/bearer).
      # Empty OPENSIGN_URL by default so a plain `up` uses native.
      OPENSIGN_URL: ${OPENSIGN_URL:-}
      OPENSIGN_APP_ID: ${OPENSIGN_APP_ID:-opensign}
      OPENSIGN_MASTER_KEY: ${OPENSIGN_MASTER_KEY:-}
      OPENSIGN_PUBLIC_URL: ${OPENSIGN_PUBLIC_URL:-}
      OPENSIGN_API_EMAIL: ${OPENSIGN_API_EMAIL:-}
      OPENSIGN_API_PASSWORD: ${OPENSIGN_API_PASSWORD:-}
      OPENSIGN_WEBHOOK_SECRET: ${OPENSIGN_WEBHOOK_SECRET:-}
    # Inline the migrate-then-serve sequence (the appliance image doesn't
    # ship ops/docker/ — only ops/scripts/, so the prod compose's entrypoint
    # path won't resolve here).
    # tsc preserves the source tree under dist/, so the entry point lives at
    # apps/api/dist/apps/api/src/server.js — not apps/api/dist/server.js.
    # --import the ESM resolve hook so extensionless dist imports load
    # cleanly under Node 24 (the bundler-mode build doesn't append .js).
    entrypoint: ['/usr/bin/tini', '--', '/bin/sh', '-c']
    command:
      - |
        set -eu
        cd /app
        echo "vibe-tb-api: applying migrations..."
        node --experimental-transform-types --import /opt/hooks/esm-resolve-hook.mjs packages/db/dist/scripts/migrate.js
        echo "vibe-tb-api: migrations done. starting server."
        exec node --experimental-transform-types --import /opt/hooks/esm-resolve-hook.mjs apps/api/dist/apps/api/src/server.js
    ports:
      - '3001:3001'
    volumes:
      - file-storage:/data/files
      - storage-mock:/data/storage-mock
      # Stage 1B — persist sealed firm key envelope across container
      # recreates. Without this, the seal file at /data/.firm-key.seal
      # lives on the ephemeral overlay FS and the appliance has to
      # re-bootstrap a new MFK every time, orphaning any encrypted
      # data already in the DB.
      - firm-key:/data/firm-key
      - ./esm-resolve-hook.mjs:/opt/hooks/esm-resolve-hook.mjs:ro
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - default
      # Q35 — reach the standalone OpenSign Parse stack over its private
      # bridge (opensign-server:8080), avoiding the self-signed TLS edge.
      - opensign-net

  worker:
    image: vibe-time-billing:local
    container_name: vibe-tb-worker
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vibe:vibe@postgres:5432/vibe_tb
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Q35 — OpenSign completion poll (safety net for the webhook). Parse
      # App-Id + Master-Key auth; standalone deploy (see ops/docker/opensign/).
      OPENSIGN_URL: ${OPENSIGN_URL:-}
      OPENSIGN_APP_ID: ${OPENSIGN_APP_ID:-opensign}
      OPENSIGN_MASTER_KEY: ${OPENSIGN_MASTER_KEY:-}
      OPENSIGN_PUBLIC_URL: ${OPENSIGN_PUBLIC_URL:-}
      OPENSIGN_API_EMAIL: ${OPENSIGN_API_EMAIL:-}
      OPENSIGN_API_PASSWORD: ${OPENSIGN_API_PASSWORD:-}
      PROPOSAL_SIGNATURE_HMAC_SEED: ${PROPOSAL_SIGNATURE_HMAC_SEED:-}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-}
      # Document-intake virus scanner (Phase D). Reached over clamd TCP.
      # Empty host disables the scan gate (intake feature off by default).
      CLAMD_HOST: ${CLAMD_HOST:-}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
    entrypoint: ['/usr/bin/tini', '--']
    command:
      [
        'node',
        '--experimental-transform-types',
        '--import',
        '/opt/hooks/esm-resolve-hook.mjs',
        'apps/worker/dist/apps/worker/src/index.js',
      ]
    volumes:
      - storage-mock:/data/storage-mock
      - ./esm-resolve-hook.mjs:/opt/hooks/esm-resolve-hook.mjs:ro
    # The image's default HEALTHCHECK probes port 3001 (the api's
    # health surface). The worker listens on 3003 — override here so
    # `docker compose ps` reflects worker health correctly.
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3003/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - default
      # Q35 — opensign-poll reaches opensign-server:8080 over this bridge.
      - opensign-net

  caddy:
    image: caddy:2-alpine
    container_name: vibe-tb-caddy
    depends_on:
      api:
        condition: service_healthy
      init-static:
        condition: service_completed_successfully
    environment:
      # Host the TLS sites bind to (internal-CA cert SAN). Default localhost;
      # set VIBE_HOST=<lan-ip> to serve the LAN over HTTPS so the Secure
      # session cookie sticks off-localhost.
      VIBE_HOST: ${VIBE_HOST:-localhost}
    ports:
      - '5195:5195'
      - '5196:5196'
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - static-content:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - default

  # Document-intake virus scanner. Only the intake pipeline (Phase D) talks
  # to it over clamd TCP 3310. Opt-in profile — the image carries a ~1GB
  # signature DB in memory, so a plain `up` skips it. Enable with
  # `--profile intake` and point the worker at it via CLAMD_HOST=clamd.
  clamd:
    image: clamav/clamav:1.3
    container_name: vibe-tb-clamd
    profiles: ['intake']
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'echo PING | nc -w 5 localhost 3310 | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - default

  # Optional connector for true end-to-end tunnel testing on local. Off by
  # default (profile) — `docker compose ... up` without the profile skips it.
  # The cloudflared image is distroless (no shell), so we pass the run-token
  # via TUNNEL_TOKEN env (cloudflared reads it automatically on `tunnel run`)
  # rather than the prod compose's file-wait wrapper.
  #
  #   TUNNEL_TOKEN=$(docker exec vibe-tb-api cat /run/cloudflared/token) \
  #   docker compose -f ops/docker/docker-compose.local.yml \
  #     --profile cloudflare up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vibe-tb-cloudflared
    profiles: ['cloudflare']
    command: ['tunnel', '--no-autoupdate', '--metrics', '0.0.0.0:2000', 'run']
    environment:
      # Optional so non-cloudflare `up`s don't require it (compose validates
      # every service regardless of active profile). Start the connector with:
      #   TUNNEL_TOKEN=$(docker exec vibe-tb-api cat /run/cloudflared/token) \
      #     docker compose -f ... --profile cloudflare up -d cloudflared
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped
    networks:
      - default
      # Q35 — reach opensign-caddy:4001 so a Cloudflare public hostname
      # (e.g. esign.vcpa.app) can route to the OpenSign signing UI.
      - opensign-net

  # =====================================================================
  # Q35 — OpenSign e-signature is deployed STANDALONE, not here.
  #
  # The real OpenSign self-host is the upstream 4-service Parse stack
  # (opensign/opensignserver:main + opensign/opensign:main + mongo +
  # caddy) — see ops/docker/opensign/docker-compose.yml. The fictional
  # single `opensignlabs/opensign:v2.4.4` image does NOT exist, so there
  # is deliberately NO opensign service in this compose.
  #
  # Bring OpenSign up:
  #   docker compose -f ops/docker/opensign/docker-compose.yml \
  #     --env-file ops/docker/opensign/.env.prod up -d
  # UI: https://localhost:4001  (self-signed cert).
  # Then point this appliance at it, e.g.:
  #   OPENSIGN_URL=https://host.docker.internal:4001/api/app
  #   OPENSIGN_APP_ID=opensign
  #   OPENSIGN_MASTER_KEY=<from ops/docker/opensign/.env.prod>
  #   OPENSIGN_PUBLIC_URL=https://localhost:4001
  #   OPENSIGN_API_EMAIL / OPENSIGN_API_PASSWORD=<an OpenSign account>
  # (or attach api/worker to the external `opensign-net` network and use
  #  OPENSIGN_URL=http://opensign-server:8080/app).
  #
  # AGPL NETWORK-BOUNDARY CONSTRAINT (see LICENSING.md): OpenSign runs only
  # as unmodified upstream images on its own network; the appliance reaches
  # it over HTTP only and never gives it our object-store creds (the API
  # fetch-and-stores the completion cert into our own storage).
  # =====================================================================

volumes:
  static-content:
  file-storage:
  storage-mock:
  firm-key:
  caddy-data:
  caddy-config:
  clamav-data:

# Join the docker_default network where vibe-tb-postgres + vibe-tb-redis +
# vibe-tb-mailhog already live (from docker-compose.dev.yml). The network
# name is the literal compose-default name Docker assigned when those
# containers came up without an explicit network in their compose file.
networks:
  default:
    name: docker_default
    external: true
  # Q35 — the standalone OpenSign stack's private bridge (created by
  # ops/docker/opensign/docker-compose.yml). api/worker join it to reach
  # opensign-server:8080 over HTTP, never crossing the public TLS edge and
  # never exposing the appliance to OpenSign beyond this link.
  opensign-net:
    name: opensign-net
    external: true
