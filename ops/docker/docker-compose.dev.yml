services:
  postgres:
    image: postgres:16-alpine
    container_name: vibe-tb-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe
      POSTGRES_DB: vibe_tb
    volumes:
      - vibe-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vibe -d vibe_tb']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vibe-tb-redis
    ports:
      - '6379:6379'
    volumes:
      - vibe-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: vibe-tb-mailhog
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: vibe-tb-ollama
    ports:
      - '11434:11434'
    volumes:
      - vibe-ollama-data:/root/.ollama
    restart: unless-stopped
    profiles: ['ai']

  # Document-intake virus scanner. Only the intake pipeline (Phase D)
  # talks to it over clamd TCP 3310. Opt-in profile because the image
  # carries a ~1GB signature DB in memory. Enable with `--profile intake`.
  clamd:
    image: clamav/clamav:1.3
    container_name: vibe-tb-clamd
    ports:
      - '3310:3310'
    volumes:
      - vibe-clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'echo PING | nc -w 5 localhost 3310 | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    profiles: ['intake']

volumes:
  vibe-pg-data:
  vibe-redis-data:
  vibe-ollama-data:
  vibe-clamav-data:
