# Cloudflare Tunnel config for Vibe Practice Management
#
# NOTE (0085): in-app provisioning replaces this file for new
# deployments. Boot the appliance, sign in as admin, and use
# Admin → Operations → Cloudflare Tunnel. The bundled cloudflared
# sidecar reads its run-token from /run/cloudflared/token (written by
# the API after the wizard completes) and runs in remotely-managed
# mode — ingress changes happen via the Cloudflare API, not via this
# local file.
#
# This file remains for operators who want a fully self-managed
# (CLI-driven) tunnel without using the admin UI:
#
#   1. Create a tunnel: `cloudflared tunnel create vibe-firm`
#   2. Copy the tunnel UUID + credentials JSON into ./creds/
#   3. Adjust the hostnames below
#   4. Mount this file at /etc/cloudflared/config.yml in the cloudflared container
#   5. Add the same hostnames to your firm's DNS in Cloudflare (CNAME → tunnel-uuid.cfargotunnel.com)
#
# Two ingress services per Q10:
#   app.firm.com    → staff app
#   portal.firm.com → client portal

tunnel: REPLACE_WITH_TUNNEL_UUID
credentials-file: /etc/cloudflared/creds/credentials.json

# Origin connection tuning — Caddy in front of the appliance handles TLS,
# so we forward HTTP from the tunnel to Caddy on port 80 inside the
# docker-compose network.
originRequest:
  connectTimeout: 30s
  keepAliveTimeout: 90s
  noTLSVerify: true

ingress:
  # Staff app — required.
  - hostname: app.firm.com
    service: http://caddy:80
    originRequest:
      httpHostHeader: app.firm.com

  # Client portal — if the firm has disabled the portal in Admin → Firm
  # settings it responds 503 by design.
  - hostname: portal.firm.com
    service: http://caddy:80
    originRequest:
      httpHostHeader: portal.firm.com

  # Catch-all required by cloudflared schema.
  - service: http_status:404

# Logging — emit JSON so the host syslog forwarder can pick it up.
loglevel: info
transport-loglevel: warn
