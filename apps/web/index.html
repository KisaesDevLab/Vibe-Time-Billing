<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f6cbd" />
    <meta
      name="description"
      content="Vibe Practice Management — self-hosted CPA practice management: time tracking, billing, proposals, tax returns, and client portal."
    />
    <title>Vibe Practice Management</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vibe-theme');
          var prefersLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = stored || (prefersLight ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('vibe-font-scale');
          var allowed = [0.9, 1, 1.15, 1.3];
          var n = raw ? parseFloat(raw) : 1;
          if (!isFinite(n) || allowed.indexOf(n) === -1) n = 1;
          document.documentElement.style.setProperty('--vibe-font-scale', String(n));
          document.body.style.zoom = String(n);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
