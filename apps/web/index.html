<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) works on notched
         phones (and in the installed PWA). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f6cbd" />
    <meta
      name="description"
      content="Vibe Practice Management — self-hosted CPA practice management: time tracking, billing, proposals, tax returns, and client portal."
    />
    <!-- iOS add-to-home-screen support (no manifest install prompt on iOS). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vibe" />
    <title>Vibe Practice Management</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vibe-theme');
          // Login / auth screens default to light (a saved preference still
          // wins); the authenticated app keeps the dark default.
          var isAuth = location.pathname.indexOf('/auth') === 0;
          var prefersLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme =
            stored || (isAuth ? 'light' : prefersLight ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <!-- FONT_SCALE_BOOTSTRAP (injected from @vibe/ui tokens by vite.config) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
