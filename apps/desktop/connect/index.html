<!doctype html>
<!-- SPDX-License-Identifier: PolyForm-Small-Business-1.0.0 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Connect to Vibe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --fg: #1b1f24;
        --muted: #5b6470;
        --card: #fff;
        --border: #d7dce2;
        --accent: #0f6cbd;
        --danger: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1419;
          --fg: #e6e9ee;
          --muted: #9aa4b1;
          --card: #171d24;
          --border: #2a323c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: min(440px, 92vw);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
      }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p { margin: 0 0 18px; color: var(--muted); }
      label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 10px 12px;
        font: inherit;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: inherit;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      button {
        margin-top: 16px;
        width: 100%;
        padding: 10px 14px;
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button[disabled] { opacity: 0.6; cursor: progress; }
      .err { color: var(--danger); margin-top: 12px; min-height: 1.4em; font-size: 13px; }
      .hint { font-size: 12px; color: var(--muted); margin-top: 14px; }
      code { font-family: ui-monospace, Consolas, monospace; }
    </style>
  </head>
  <body>
    <form class="card" id="f">
      <h1>Connect to your Vibe server</h1>
      <p>Enter the address you use for Vibe Time &amp; Billing in the browser.</p>
      <label for="url">Server address</label>
      <input id="url" name="url" type="text" placeholder="https://app.yourfirm.com" autocomplete="url" spellcheck="false" required />
      <button id="go" type="submit">Connect</button>
      <div class="err" id="err" role="alert"></div>
      <div class="hint">
        Only the firm's own appliance is contacted. You can change this later under
        <strong>Account → Desktop app → Server</strong>.
      </div>
    </form>
    <script>
      const f = document.getElementById('f');
      const url = document.getElementById('url');
      const go = document.getElementById('go');
      const err = document.getElementById('err');
      const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
      const friendly = (e) => {
        const s = String(e);
        if (s.startsWith('unreachable')) return 'Could not reach that address. Check the URL and your network/VPN.';
        if (s.startsWith('not_a_vibe_server')) return 'That address answered, but it is not a Vibe server.';
        if (s === 'https_required') return 'Use https:// (http is only allowed for localhost).';
        if (s === 'empty' || s === 'missing_host') return 'Enter the server address.';
        return 'Could not connect: ' + s;
      };
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.textContent = '';
        go.disabled = true;
        go.textContent = 'Connecting…';
        try {
          await invoke('set_server_url', { url: url.value });
          // Rust navigates this window to the server on success.
        } catch (ex) {
          err.textContent = friendly(ex);
          go.disabled = false;
          go.textContent = 'Connect';
        }
      });
      url.focus();
    </script>
  </body>
</html>
