<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f6cbd" />
    <meta
      name="description"
      content="Client portal — view invoices, pay online, manage statements with your CPA firm."
    />
    <title>Client Portal</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vibe-theme');
          var prefersLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = stored || (prefersLight ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
