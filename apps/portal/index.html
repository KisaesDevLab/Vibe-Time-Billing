<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) works in the installed
         PWA (black-translucent status bar renders content under the notch
         otherwise). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Firm-branded PWA manifest, served dynamically from the API. -->
    <link rel="manifest" href="/api/portal/manifest.webmanifest" />
    <meta name="theme-color" content="#0f6cbd" />
    <meta
      name="description"
      content="Client portal — view invoices, pay online, manage statements with your CPA firm."
    />
    <!-- iOS add-to-home-screen support (no manifest install prompt on iOS). -->
    <link rel="apple-touch-icon" href="/api/portal/branding/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Client Portal" />
    <title>Client Portal</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vibe-theme');
          // Login / auth screens default to light (a saved preference still
          // wins); the authenticated portal keeps the dark default.
          var isAuth = location.pathname.indexOf('/auth') === 0;
          var prefersLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme =
            stored || (isAuth ? 'light' : prefersLight ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <!-- FONT_SCALE_BOOTSTRAP (injected from @vibe/ui tokens by vite.config) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
